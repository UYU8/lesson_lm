<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { font-family: "SimSun", "宋体", serif; }
</style>
</head>
<body>
<svg width="900" height="560" viewBox="0 0 900 560">

  <!-- 用户（中心顶部） -->
  <rect x="370" y="30" width="120" height="44" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="430" y="57" font-size="16" text-anchor="middle" fill="#000">用户</text>

  <!-- 账单分类（左中） -->
  <rect x="80" y="240" width="130" height="44" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="145" y="267" font-size="16" text-anchor="middle" fill="#000">账单分类</text>

  <!-- 账单流水（左下） -->
  <rect x="80" y="440" width="130" height="44" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="145" y="467" font-size="16" text-anchor="middle" fill="#000">账单流水</text>

  <!-- 聊天消息（右中） -->
  <rect x="680" y="240" width="130" height="44" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="745" y="267" font-size="16" text-anchor="middle" fill="#000">聊天消息</text>

  <!-- 分享（右下） -->
  <rect x="680" y="440" width="130" height="44" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="745" y="467" font-size="16" text-anchor="middle" fill="#000">分享</text>

  <!-- 关系菱形：拥有（分类） -->
  <polygon points="240,220 270,240 240,260 210,240" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="245" font-size="13" text-anchor="middle" fill="#000">拥有</text>

  <!-- 关系菱形：产生（消息） -->
  <polygon points="620,220 650,240 620,260 590,240" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="245" font-size="13" text-anchor="middle" fill="#000">产生</text>

  <!-- 关系菱形：发起（分享） -->
  <polygon points="745,370 775,390 745,410 715,390" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="395" font-size="13" text-anchor="middle" fill="#000">发起</text>

  <!-- 关系菱形：拥有（流水） -->
  <polygon points="145,350 175,370 145,390 115,370" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="145" y="375" font-size="13" text-anchor="middle" fill="#000">拥有</text>

  <!-- 连线：用户→拥有(分类) -->
  <line x1="370" y1="52" x2="270" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="210" y1="240" x2="145" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="145" y1="240" x2="145" y2="240" stroke="#333" stroke-width="1.5"/>

  <!-- 连线：用户→拥有(流水) -->
  <line x1="370" y1="52" x2="280" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="280" y1="52" x2="280" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="280" y1="370" x2="175" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="115" y1="370" x2="80" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="370" x2="80" y2="462" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="462" x2="80" y2="462" stroke="#333" stroke-width="1.5"/>

  <!-- 连线：账单分类→归属→账单流水 -->
  <line x1="145" y1="284" x2="145" y2="440" stroke="#333" stroke-width="1.5"/>
  <text x="158" y="365" font-size="13" fill="#000">归属</text>

  <!-- 连线：用户→产生(消息) -->
  <line x1="490" y1="52" x2="590" y2="240" stroke="#333" stroke-width="1.5"/>
  <line x1="650" y1="240" x2="680" y2="240" stroke="#333" stroke-width="1.5"/>

  <!-- 连线：用户→发起(分享) -->
  <line x1="490" y1="52" x2="580" y2="52" stroke="#333" stroke-width="1.5"/>
  <line x1="580" y1="52" x2="580" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="580" y1="390" x2="715" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="745" y1="410" x2="745" y2="440" stroke="#333" stroke-width="1.5"/>

  <!-- 基数标注 -->
  <text x="348" y="95" font-size="13" fill="#000">1</text>
  <text x="222" y="228" font-size="13" fill="#000">N</text>
  <text x="290" y="48" font-size="13" fill="#000">1</text>
  <text x="90" y="410" font-size="13" fill="#000">N</text>
  <text x="505" y="95" font-size="13" fill="#000">1</text>
  <text x="602" y="228" font-size="13" fill="#000">N</text>
  <text x="565" y="48" font-size="13" fill="#000">1</text>
  <text x="730" y="432" font-size="13" fill="#000">N</text>
  <text x="130" y="300" font-size="13" fill="#000">1</text>
  <text x="130" y="432" font-size="13" fill="#000">N</text>

</svg>
</body>
</html>
